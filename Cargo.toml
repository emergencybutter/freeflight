[workspace]
resolver = "2"
members = [
    "crates/ff-core",
    "crates/ff-cifp",
    "crates/ff-nasr",
    "crates/ff-charts",
    "crates/ff-weather",
    "crates/ff-notam",
    "crates/ff-planning",
    "crates/ff-postflight",
    "crates/ff-storage",
    "crates/ff-sync",
    "crates/ff-wasm",
    "crates/ff-uniffi",
    "services/ff-api",
    "services/ff-etl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/emergencybutter/freeflight"
publish = false

[workspace.dependencies]
# intra-workspace
ff-core = { path = "crates/ff-core" }
ff-cifp = { path = "crates/ff-cifp" }
ff-nasr = { path = "crates/ff-nasr" }
ff-charts = { path = "crates/ff-charts" }
ff-weather = { path = "crates/ff-weather" }
ff-notam = { path = "crates/ff-notam" }
ff-planning = { path = "crates/ff-planning" }
ff-postflight = { path = "crates/ff-postflight" }
ff-storage = { path = "crates/ff-storage" }
ff-sync = { path = "crates/ff-sync" }
ff-etl = { path = "services/ff-etl" }

# shared external deps, kept at one version across the workspace
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.7"
tower-http = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
