org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Which ABIs the Rust core is cross-compiled for. Building every ABI
# takes minutes (rusqlite compiles SQLite from source per target), and a
# development loop only ever installs one, so the default covers real
# devices (arm64) and the emulator (x86_64). Override for a release that
# has to include 32-bit hardware:
#   ./gradlew assembleRelease -Pff.abis=arm64-v8a,armeabi-v7a,x86_64
ff.abis=arm64-v8a,x86_64

# Where the app looks for ff-api when nothing is configured in Settings.
#
# The production deployment (deploy/README.md): nginx on vya2 serves the
# web client at / and reverse-proxies /cycles, /bundles, /weather, /notams,
# /data and /health to ff-api, so the app and its data share one hostname
# over HTTPS. Sideloading the APK therefore works with no configuration.
#
# To build against an ff-api on your own machine instead:
#   ./gradlew assembleDebug -Pff.defaultApiBaseUrl=http://10.0.2.2:8080
# (10.0.2.2 is the host loopback as seen from the emulator; for a physical
# device use `adb reverse tcp:8080 tcp:8080` and 127.0.0.1, or your LAN
# IP. Cleartext to either is permitted in debug builds only.)
# It can also be changed at runtime in the app's Settings tab.
ff.defaultApiBaseUrl=https://freeflight.flyvoyager.net
