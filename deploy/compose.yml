# freeflight ff-api service on vya2.flyvoyager.net.
# Mirrors the butterbot/missiongen pattern: locally-built image, no registry,
# joined to the shared `vya2net` network so the central nginx can proxy to it.
services:
  ff-api:
    image: ff-api:latest
    pull_policy: never
    container_name: freeflight-api
    restart: unless-stopped
    environment:
      - FF_ETL_DATA_DIR=/data
      - PORT=8080
    # Secrets (FF_NOTAM_CLIENT_ID/FF_NOTAM_CLIENT_SECRET for the FAA NMS
    # NOTAM proxy) live in a server-only .env — never committed. Optional
    # so a fresh checkout without it still starts (NOTAMs just stay off).
    env_file:
      - path: .env
        required: false
    volumes:
      - /containers/freeflight/data:/data:ro
    networks:
      - vya2net

networks:
  vya2net:
    external: true
