# nginx vhost for freeflight.flyvoyager.net — install to
# /containers/nginx/conf.d/freeflight.conf on vya2.
# Serves the static web client and reverse-proxies the ff-api JSON/data
# endpoints (and /bundles PMTiles, which need Range support — ServeDir on the
# ff-api side provides it and nginx forwards Range by default).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name freeflight.flyvoyager.net;
    include /etc/nginx/conf.d/snippets/ssl.conf;

    # PMTiles chart files are large; allow big range responses to stream.
    client_max_body_size 0;

    root /srv/freeflight;
    index index.html;

    # nginx's stock mime.types has no `.mjs` entry, so it falls back to
    # application/octet-stream — browsers refuse to load an ES module
    # (pdf.js's worker, fetched via `new Worker(url, {type: "module"})`)
    # served with that MIME type. Vite emits pdf.js's worker chunk as
    # `assets/pdf.worker.min-*.mjs`; this makes that (and any other
    # `.mjs` asset) serve as real JavaScript instead.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # `/settings` is a client-rendered SPA route (like `/about`), served by
    # the `location /` try_files fallback below — NOT proxied. Only the
    # `/auth/*` API endpoints (OAuth login/callback/me/logout) go upstream.
    location ~ ^/(data|bundles|weather|notams|cycles|health|dtpp|auth)(/|$) {
        set $upstream freeflight-api:8080;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.ht {
        deny all;
    }
}
