[package]
name = "ff-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Weather/NOTAM proxy and cycle-bundle hosting server (DESIGN.md §4, §7)."

[dependencies]
ff-accounts.workspace = true
ff-weather.workspace = true
ff-notam.workspace = true
ff-sync.workspace = true
ff-etl.workspace = true
axum.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
tower-http = { workspace = true, features = ["cors", "fs"] }
tokio = { workspace = true, features = ["net", "signal", "fs"] }
serde.workspace = true
serde_json.workspace = true
# Session expiry timestamps crossing into ff-accounts (TIMESTAMPTZ).
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# OS randomness for opaque session/CSRF-state tokens in routes::auth. Kept
# minimal (no oauth2/openidconnect crate) since the flow is a plain
# authorization-code exchange we drive with the reqwest client above.
getrandom = "0.2"
